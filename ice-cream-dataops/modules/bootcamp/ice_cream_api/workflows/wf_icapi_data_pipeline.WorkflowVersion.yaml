workflowExternalId: wf_icapi_data_pipeline
version: '3'
workflowDefinition:
  description: ''
  tasks:
    - externalId: create_asset_hierarchy_task
      type: transformation
      parameters:
        transformation:
          externalId: create_asset_hierarchy
          concurrencyPolicy: fail
        name: 'Task One'
        dependsOn:
          - externalId: contextualize_ts_assets_task
    - externalId: contextualize_ts_assets_task
      type: transformation
      parameters:
        transformation:
          externalId: contextualize_ts_assets
          concurrencyPolicy: fail
        name: 'Task One'
        dependsOn:
          - externalId: icapi_datapoints_extractor_task
    - externalId: icapi_datapoints_extractor_task
      type: 'function'
      parameters:
        function:
          externalId: icapi_datapoints_extractor
          data: { "hours" : 1 }
        retries: 3
        timeout: 3600
        inFailure: abortWorkflow
        dependsOn:
          - externalId: oee_timeseries_task
    - externalId: oee_timeseries_task
      type: 'function'
      parameters:
        function:
          externalId: oee_timeseries
          data: { "hours" : 1 }
        retries: 3
        timeout: 3600
        inFailure: abortWorkflow
        dependsOn:
          - externalId: oee_timeseries_task
  
